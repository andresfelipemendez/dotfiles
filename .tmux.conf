unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
bind r source-file ~/.tmux.conf
bind x kill-pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on

# Rectangular (block) selection: hold Alt while dragging
bind -T copy-mode M-MouseDrag1Pane select-pane \; send-keys -X begin-selection \; send-keys -X rectangle-toggle

# Cross-platform clipboard integration for copy-mode.
# The tool is picked when the copy runs, not when the config loads, so one
# checkout works on macOS (pbcopy), Wayland (wl-copy), X11 (xclip) and WSL
# (clip.exe) — and keeps working if the session type changes under a
# long-lived tmux server.
set -g @copy_command 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy; \
elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; \
elif command -v clip.exe >/dev/null 2>&1; then clip.exe; \
else cat >/dev/null; fi'

# Also hand the copy to the terminal over OSC 52, which covers SSH sessions
# where no local clipboard tool can be reached.
set -s set-clipboard on

# Keyboard copy: y for vi mode-keys, M-w for emacs (tmux's default)
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode   M-w   send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode   Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# Mouse drag: tmux's default binding copies to a tmux buffer only, so the
# selection never reaches the system clipboard. Pipe it through the same command.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
# Double/triple click select word/line and copy
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "#{@copy_command}"

set -g base-index 1
setw -g pane-base-index 1
# close a window -> higher windows shift down to fill the gap
set -g renumber-windows on

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# statusbar
set -g status-position bottom

# Japanese date/time in the onedark status bar
set -g @onedark_time_format "%H:%M"
set -g @onedark_date_format "%Y年%m月%d日"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# The onedark theme leaves status-style at tmux's default green; override after TPM
set -g status-style bg='#282c34',fg='#abb2bf'
